name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Test
        env:
          AUTO_DEMO: "false"
          EVIDENCE_DIR: /tmp/civwatch-evidence-ci
          CELL_TITAN_ENV: development
        run: python -m pytest -q --tb=short
      - name: Import check
        run: python -c "from main import app; from titan.evidence import EvidenceChain"
